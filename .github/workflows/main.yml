name: CI

# Every push and PR builds and packs the two npm packages:
#   wispx-epoxy-tls        (client/, the epoxy client with WispX)
#   wispx-epoxy-transport  (integrations/scramjet/epoxy-transport/, bundles the client)
# On a push to main, the packages go up as a "latest" pre-release on GitHub, and each package
# whose package.json version isn't on npm yet is published there (needs the NPM_TOKEN secret).

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Check Versions
    runs-on: ubuntu-latest
    outputs:
      client_version: ${{ steps.check.outputs.client_version }}
      client_new: ${{ steps.check.outputs.client_new }}
      transport_version: ${{ steps.check.outputs.transport_version }}
      transport_new: ${{ steps.check.outputs.transport_new }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check which versions are on npm
        id: check
        run: |
          check() { # name dir key
            VERSION=$(jq -r .version "$2/package.json")
            PUBLISHED=$(npm view "$1@$VERSION" version 2>/dev/null || true)
            echo "$1 $VERSION: ${PUBLISHED:+already on npm}${PUBLISHED:-not on npm yet}"
            echo "${3}_version=$VERSION" >> "$GITHUB_OUTPUT"
            if [ -z "$PUBLISHED" ]; then echo "${3}_new=true" >> "$GITHUB_OUTPUT"; else echo "${3}_new=false" >> "$GITHUB_OUTPUT"; fi
          }
          check wispx-epoxy-tls client client
          check wispx-epoxy-transport integrations/scramjet/epoxy-transport transport

  build:
    name: Build Epoxy (client)
    runs-on: ubuntu-latest
    defaults:
      run:
          working-directory: ./client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: install wbg
        uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: '0.2.100'

      - name: Setup Binaryen
        uses: Aandreba/setup-binaryen@v1.0.0
        with:
          token: ${{ github.token }}

      - name: Pack Epoxy
        run: npm pack

      - name: Upload Artifact (packaged)
        uses: actions/upload-artifact@v4
        with:
          name: epoxy-client-package
          path: ./client/wispx-epoxy-tls-*.tgz

  transport:
    name: Build Transport
    runs-on: ubuntu-latest
    needs: [build]
    defaults:
      run:
          working-directory: ./integrations/scramjet/epoxy-transport

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Get the client package
        uses: actions/download-artifact@v4
        with:
          name: epoxy-client-package
          path: ./client

      - name: Build and pack
        run: |
          # the client from this run, not the registry's
          npm install --no-save ../../../client/wispx-epoxy-tls-*.tgz
          npm pack   # builds first (prepack)

      - name: Upload Artifact (packaged)
        uses: actions/upload-artifact@v4
        with:
          name: epoxy-transport-package
          path: ./integrations/scramjet/epoxy-transport/wispx-epoxy-transport-*.tgz

  upload:
    name: Upload release
    runs-on: ubuntu-latest
    needs: [version-check, build, transport]
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Get artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: epoxy-*-package
          merge-multiple: true
          path: .

      - name: Delete old release and tag
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          delete_release: true
          tag_name: latest
          github_token: ${{ github.token }}

      - name: Release unstable build to GitHub
        uses: ncipollo/release-action@v1
        with:
          name: Continuous Build
          tag: latest
          commit: ${{ github.sha }}
          body: "${{ github.event.head_commit.url }} ${{ github.event.head_commit.message }}"
          artifacts: "*.tgz"
          prerelease: true

      - name: Release tagged version to GitHub
        if: needs.version-check.outputs.client_new == 'true'
        uses: ncipollo/release-action@v1
        with:
          name: "${{ needs.version-check.outputs.client_version }}"
          tag: "v${{ needs.version-check.outputs.client_version }}"
          commit: ${{ github.sha }}
          body: "${{ github.event.head_commit.url }} ${{ github.event.head_commit.message }}"
          artifacts: "*.tgz"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [version-check, build, transport]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.version-check.outputs.client_new == 'true' || needs.version-check.outputs.transport_new == 'true')

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Get artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: epoxy-*-package
          merge-multiple: true
          path: .

      - name: Publish wispx-epoxy-tls
        if: needs.version-check.outputs.client_new == 'true'
        run: npm publish wispx-epoxy-tls-${{ needs.version-check.outputs.client_version }}.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish wispx-epoxy-transport
        if: needs.version-check.outputs.transport_new == 'true'
        run: npm publish wispx-epoxy-transport-${{ needs.version-check.outputs.transport_version }}.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
