[package]
name = "wisp-bench"
version = "0.1.0"
edition = "2021"
description = "Benchmarks Wisp/WispX servers and clients, including the original wisp-mux client."

[dependencies]
anyhow = "1.0.86"
bytes = "1.7.1"
clap = { version = "4.5.16", features = ["derive"] }
futures = "0.3.30"
http = "1.1.0"
libc = "0.2.158"
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.125"
tokio = { version = "1.43.0", features = ["full"] }
tokio-websockets = { version = "0.12.3", features = ["client", "sha1_smol", "rand"] }
wisp-mux = { path = "../wisp", features = ["tokio-websockets"], default-features = false }
wisp-mux-legacy = { path = "wisp-legacy", features = ["tokio-websockets"], default-features = false }
